<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Download Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<div class="card">

    <div class="icon">
        ⬇
    </div>

    <h2>Downloading...</h2>

    <div class="progress">
        <div class="fill"></div>
    </div>

    <div class="percentage">
        <span>0%</span>
        <span>100%</span>
    </div>

    <p class="status">
        Download Complete ✔
    </p>

</div>
<script src="script.js"></script>

</body>
</html>
